<style>
:root{--navy:#34355f;--ink:#26274a;--green:#0b5a47;--gold:#d6bf8c;--paper:#f5f3ec;--red:#9b1c1c}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink)}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
[hidden]{display:none !important}
.top{background:var(--navy);color:#fff;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 32px}
.brand{display:flex;align-items:center;gap:14px}
.badge{display:inline-flex;padding:4px;background:#fff;border-radius:6px}
.badge img{display:block;height:44px;width:auto}
.brand b{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;line-height:1.05}
.brand span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 18px;border:2px solid transparent;background:var(--navy);color:#fff;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;text-decoration:none}
.btn:hover{background:var(--ink)}
.btn.line{background:transparent;border-color:#fff}
.btn.line:hover{background:#fff;color:var(--ink)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.red{background:#fff;color:var(--red);border-color:var(--red)}
.btn.red:hover{background:var(--red);color:#fff}
.btn[disabled]{opacity:.6;cursor:wait}
main{max-width:1240px;margin:0 auto;padding:28px 24px 64px}
/* login */
.login{max-width:420px;margin:56px auto;background:#fff;border-top:3px solid var(--gold);padding:36px}
.login h1{margin:0 0 6px;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:38px}
.login p{margin:0 0 22px;font-size:14px;line-height:1.6}
label{display:block;font-size:14px;font-weight:500;margin-bottom:6px}
input[type=text],input[type=password],input[type=search],select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid rgba(38,39,74,.5);border-radius:0;background:#fff;color:var(--ink);font:inherit;font-size:15px}
textarea{min-height:110px;resize:vertical}
.msg{margin:14px 0 0;font-size:14px;font-weight:500;color:var(--red)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.stat{background:#fff;border-top:3px solid var(--gold);padding:16px 18px}
.stat b{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:40px;line-height:1;font-weight:600;color:var(--green)}
.stat span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
/* toolbar + table */
.bar{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:12px;align-items:end;margin-bottom:14px}
.count{font-size:13px;margin:0 0 10px}
.tablewrap{background:#fff;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
th{background:var(--navy);color:#fff;text-align:left;padding:12px 14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid rgba(38,39,74,.12);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--paper)}
tbody tr.sel{background:#ece8d9}
.ref{font-weight:600;color:var(--green);white-space:nowrap}
.sub{display:block;font-size:12px;color:rgba(38,39,74,.75)}
.pill{display:inline-block;padding:3px 10px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:20px;background:#e6e6ee;color:var(--ink);white-space:nowrap}
.pill.New{background:var(--gold)}
.pill.Under{background:#dbe4f5}
.pill.Contacted{background:#e1efe8}
.pill.Accepted{background:var(--green);color:#fff}
.pill.Waitlisted{background:#f4e2c4}
.pill.Declined{background:#f0d6d6;color:var(--red)}
.tour{font-size:11px;font-weight:600;color:var(--green);letter-spacing:.06em;text-transform:uppercase}
.empty{padding:48px 20px;text-align:center;font-size:15px}
/* drawer */
.shade{position:fixed;inset:0;background:rgba(20,20,45,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:#fff;z-index:50;overflow-y:auto;box-shadow:-10px 0 30px rgba(20,20,45,.3)}
.dhead{position:sticky;top:0;background:var(--navy);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dhead h2{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:30px;line-height:1.1}
.dhead small{display:block;margin-top:4px;font-size:12px;letter-spacing:.08em;color:var(--gold)}
.x{background:none;border:2px solid #fff;color:#fff;width:40px;height:40px;font-size:20px;line-height:1}
.dbody{padding:8px 24px 32px}
.sec{margin-top:22px}
.sec h3{margin:0 0 8px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--green)}
dl{margin:0;border-top:1px solid rgba(38,39,74,.2)}
.row{display:flex;flex-wrap:wrap;gap:4px 16px;padding:10px 0;border-bottom:1px solid rgba(38,39,74,.2)}
.row dt{flex:0 0 150px;font-size:13px;font-weight:600}
.row dd{flex:1 1 200px;margin:0;font-size:14px;line-height:1.5;word-break:break-word;white-space:pre-wrap}
.row a{color:var(--green);font-weight:500}
.office{background:var(--paper);padding:16px;display:grid;gap:14px}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.saved{font-size:13px;font-weight:600;color:var(--green);align-self:center}
@media (max-width:760px){.bar{grid-template-columns:1fr 1fr}.bar>div:first-child{grid-column:1/-1}.top{padding:12px 16px}main{padding:20px 14px 48px}}
@media print{
body *{visibility:hidden}
.drawer,.drawer *{visibility:visible}
.drawer{position:absolute;inset:0;width:100%;box-shadow:none;overflow:visible}
.dhead{position:static;background:#fff;color:#000;border-bottom:2px solid #000}.dhead small{color:#000}
.x,.acts,.office select,.shade{display:none !important}
}

/* Premium visual refinements — shared optical rhythm and texture */
body{font-weight:400;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0;z-index:999;pointer-events:none;opacity:.02;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E")}
:focus-visible{outline:2px solid rgba(32,43,89,.6);outline-offset:3px}
.strip-head h2,.about h2,.curr h2,.life h2,.phil h2,.curr .card h3,.apply-hero h1,.done h2,.aside-box h2,.login h1,.dhead h2,.stat b{font-weight:500;letter-spacing:-.015em}
.eyebrow{font-variant-caps:all-small-caps;letter-spacing:.18em}
.strip-col p,.about p,.card p,.phil-col p,.life p,.apply-hero p,.form-card p,.aside p{font-weight:400}
.nbtn,.nlink{position:relative;border-bottom-color:transparent}
.nbtn::after,.nlink::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--green);transform:scaleX(0);transform-origin:center;transition:transform .24s ease}
.nbtn:hover::after,.nbtn[aria-expanded="true"]::after,.nlink:hover::after,.nlink[aria-current]::after{transform:scaleX(1)}
.nbtn:hover,.nbtn[aria-expanded="true"],.nlink:hover,.nlink[aria-current]{border-bottom-color:transparent}
.btn-g,.btn-o,.btn-n,.cta,.btn{font-size:11.5px;letter-spacing:.15em;transition:transform .18s ease,background-color .18s ease,color .18s ease,box-shadow .18s ease}
.btn-g:hover,.btn-o:hover,.btn-n:hover,.cta:hover,.btn:hover{transform:translateY(-1px)}
.btn-g:active,.btn-o:active,.btn-n:active,.cta:active,.btn:active{transform:translateY(0)}
.card,.form-card,.login,.stat,.tablewrap{border:1px solid rgba(32,43,89,.06);box-shadow:0 1px 0 rgba(32,43,89,.04),0 8px 20px -12px rgba(32,43,89,.16)!important}
.card{transition:transform .22s ease,box-shadow .22s ease}
.card:hover{transform:translateY(-2px) scale(1.005);box-shadow:0 1px 0 rgba(32,43,89,.06),0 16px 32px -16px rgba(32,43,89,.22)!important}
.panel,.drawer{box-shadow:0 20px 44px -20px rgba(32,43,89,.32)!important}
.phil-col p{text-indent:-.4em;padding-left:.4em}
.card .num{position:absolute;top:18px;right:22px;text-align:right;font-size:40px;color:rgba(8,98,79,.5)}
.curr .card{position:relative;padding:36px}
.curr .card h3{font-weight:500;letter-spacing:-.015em}
.about-text{flex:1.2 1 360px}
.phil-grid{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.grid{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
figure{position:relative}
figure::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(32,43,89,.08)}
@media(prefers-reduced-motion:reduce){.nbtn::after,.nlink::after,.btn-g,.btn-o,.btn-n,.cta,.btn,.card{transition:none!important}.card:hover,.btn-g:hover,.btn-o:hover,.btn-n:hover,.cta:hover,.btn:hover{transform:none}}
/* Admin surfaces, hairlines and three reserved gold details */
.top{border-bottom:4px solid var(--gold)}
.login{border-top:2px solid var(--green)}
.login h1::after{content:"";display:block;width:42px;height:4px;margin-top:14px;background:var(--gold)}
.stat{border-top:2px solid var(--green)}
.pill.New{background:var(--gold);color:var(--ink)}
.brand span,.dhead small{color:rgba(255,255,255,.78)}
.btn.gold{background:var(--green);color:#fff}
/* Unified elevation tokens and final non-gold overrides */
*{box-shadow:none!important}
.hwrap{border-bottom:1px solid rgba(32,43,89,.08)}
.panel{border-top-color:rgba(32,43,89,.6);box-shadow:0 20px 44px -20px rgba(32,43,89,.32)!important}
.drawer{box-shadow:0 20px 44px -20px rgba(32,43,89,.32)!important}
.card,.form-card,.login,.stat,.tablewrap{box-shadow:0 1px 0 rgba(32,43,89,.04),0 8px 20px -12px rgba(32,43,89,.16)!important}
.card:hover{box-shadow:0 1px 0 rgba(32,43,89,.06),0 16px 32px -16px rgba(32,43,89,.22)!important}
.wa,.fcall{box-shadow:0 1px 0 rgba(32,43,89,.04),0 8px 20px -12px rgba(32,43,89,.16)!important}
.hero::after,figure::after{box-shadow:inset 0 0 0 4px rgba(32,43,89,.14)!important}
.card .more:hover{border-bottom-color:var(--green)}
.apply-hero .eyebrow{color:rgba(255,255,255,.82)}
.f-col .dir{color:rgba(255,255,255,.84)}
/* Final edge, image-frame and accent calibration */
.badge{padding:2px}
.card,.form-card{border:1px solid rgba(32,43,89,.06)!important}
.hero::after{box-shadow:inset 0 0 0 4px rgba(32,43,89,.14)!important}
figure::after{box-shadow:inset 0 0 0 1px rgba(32,43,89,.08)!important}
.hero-cta .btn-g:hover{filter:brightness(.96);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)!important}</style>
</head>

  <div class="tools" id="tools" hidden>
    <button class="btn line" id="refresh" type="button">Refresh</button>
    <a class="btn line" href="/api/admin/export.csv">Export CSV</a>

<main>
  <section class="login" id="login" hidden aria-labelledby="login-h">
    <h1 id="login-h">Staff sign in</h1>
    <p>Enter the admin password to view submitted admission forms.</p>
    <form id="login-form">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <p class="msg" id="login-msg" role="alert" hidden></p>
      <p style="margin:18px 0 0"><button class="btn" type="submit" id="login-btn">Sign in</button></p>
    </form>
  </section>

  <section id="dash" hidden>
    <div class="stats" id="stats"></div>
    <div class="bar">
      <div><label for="q">Search</label><input id="q" type="search" placeholder="Student, parent, phone or reference"></div>
      <div><label for="f-status">Status</label><select id="f-status"><option value="">All statuses</option></select></div>
      <div><label for="f-section">Section</label><select id="f-section"><option value="">All sections</option><option>Preschool</option><option>Primary</option><option>Secondary</option></select></div>
      <div><label class="tour" style="margin:0 0 10px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="f-tour"> Tour requests</label></div>
    </div>
    <p class="count" id="count" aria-live="polite"></p>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Reference</th><th>Submitted</th><th>Student</th><th>Section</th><th>Parent / guardian</th><th>Phone</th><th>Status</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden></div>
    </div>
  </section>
</main>

<div class="shade" id="shade" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title" hidden>
  <div class="dhead"><div><h2 id="d-title"></h2><small id="d-sub"></small></div><button class="x" id="d-close" type="button" aria-label="Close">&times;</button></div>
  <div class="dbody" id="d-body"></div>
</aside>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var apps = [], statuses = [], selectedId = null, poll = null;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(iso) { var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  function age(dob) {
    var b = new Date(dob), n = new Date(); if (isNaN(b)) return '';
    var a = n.getFullYear() - b.getFullYear();
    if (n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) a--;
    return a;
  }
  function pillClass(s) { return s.split(' ')[0]; }

  function api(url, opts) {
    opts = opts || {}; opts.credentials = 'same-origin';
    if (opts.body) opts.headers = { 'Content-Type': 'application/json' };
    return fetch(url, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (r.status === 401 && url.indexOf('/login') === -1) { showLogin(); throw new Error('auth'); }
        if (!r.ok) throw new Error(j.error || 'Something went wrong.');
        return j;
      });
    });
  }

  /* views */
  function showLogin() {
    clearInterval(poll); closeDrawer();
    $('dash').hidden = true; $('tools').hidden = true; $('login').hidden = false;
    document.title = 'Admissions Office | Royal International Schools';
    $('pw').value = ''; $('pw').focus();
  }
  function showDash() {
    $('login').hidden = true; $('dash').hidden = false; $('tools').hidden = false;
    load(); clearInterval(poll); poll = setInterval(function () { load(true); }, 30000);
  }

  $('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var m = $('login-msg'); m.hidden = true; $('login-btn').disabled = true;
    api('/api/admin/login', { method: 'POST', body: JSON.stringify({ password: $('pw').value }) })
      .then(showDash)
      .catch(function (err) { m.textContent = err.message; m.hidden = false; })
      .then(function () { $('login-btn').disabled = false; });
  });
  $('logout').addEventListener('click', function () { api('/api/admin/logout', { method: 'POST', body: '{}' }).catch(function () {}).then(showLogin); });
  $('refresh').addEventListener('click', function () { load(); });

  /* data */
  function load(quiet) {
    return api('/api/admin/applications').then(function (j) {
      apps = j.applications; statuses = j.statuses;
      var fs = $('f-status');
      if (fs.options.length === 1) statuses.forEach(function (s) { var o = document.createElement('option'); o.textContent = s; o.value = s; fs.appendChild(o); });
      render();
      var n = apps.filter(function (a) { return a.status === 'New'; }).length;
      document.title = (n ? '(' + n + ') ' : '') + 'Admissions Office | Royal International Schools';
      if (selectedId && !$('drawer').hidden && !quiet) openDrawer(selectedId);
    }).catch(function (e) { if (e.message !== 'auth' && !quiet) alert(e.message); });
  }

  function filtered() {
    var q = $('q').value.trim().toLowerCase(), st = $('f-status').value, se = $('f-section').value, tour = $('f-tour').checked;
    return apps.filter(function (a) {
      if (st && a.status !== st) return false;
      if (se && a.section !== se) return false;
      if (tour && a.tour !== 'Yes') return false;
      if (!q) return true;
      return [a.reference, a.student_first_name, a.student_last_name, a.parent_name, a.phone, a.email].join(' ').toLowerCase().indexOf(q) !== -1;
    });
  }

  function render() {
    var c = function (f) { return apps.filter(f).length; };
    $('stats').innerHTML =
      stat(apps.length, 'All applications') + stat(c(function (a) { return a.status === 'New'; }), 'New') +
      stat(c(function (a) { return a.status === 'Under review'; }), 'Under review') +
      stat(c(function (a) { return a.status === 'Accepted'; }), 'Accepted') +
      stat(c(function (a) { return a.tour === 'Yes'; }), 'Tour requests');
    var list = filtered();
    $('count').textContent = list.length + ' of ' + apps.length + ' application' + (apps.length === 1 ? '' : 's');
    $('rows').innerHTML = list.map(function (a) {
      return '<tr data-id="' + esc(a.id) + '" tabindex="0" class="' + (a.id === selectedId ? 'sel' : '') + '">' +
        '<td class="ref">' + esc(a.reference) + '</td>' +
        '<td>' + esc(fmt(a.createdAt)) + '</td>' +
        '<td>' + esc(a.student_first_name + ' ' + a.student_last_name) + '<span class="sub">Age ' + esc(age(a.student_dob)) + (a.tour === 'Yes' ? ' &middot; <span class="tour">Tour</span>' : '') + '</span></td>' +
        '<td>' + esc(a.section) + (a.class_applying ? '<span class="sub">' + esc(a.class_applying) + '</span>' : '') + '</td>' +
        '<td>' + esc(a.parent_name) + '<span class="sub">' + esc(a.relationship) + '</span></td>' +
        '<td>' + esc(a.phone) + '</td>' +
        '<td><span class="pill ' + pillClass(a.status) + '">' + esc(a.status) + '</span></td></tr>';
    }).join('');
    var empty = $('empty');
    empty.hidden = list.length > 0;
    empty.textContent = apps.length ? 'No applications match your filters.' : 'No applications yet. New submissions from the website will appear here.';
  }
  function stat(n, label) { return '<div class="stat"><b>' + n + '</b><span>' + esc(label) + '</span></div>'; }

  ['q', 'f-status', 'f-section', 'f-tour'].forEach(function (id) { $(id).addEventListener('input', render); $(id).addEventListener('change', render); });
  $('rows').addEventListener('click', function (e) { var tr = e.target.closest('tr'); if (tr) openDrawer(tr.getAttribute('data-id')); });
  $('rows').addEventListener('keydown', function (e) { if (e.key === 'Enter') { var tr = e.target.closest('tr'); if (tr) openDrawer(tr.getAttribute('data-id')); } });

  /* detail drawer */
  function row(k, v) { return '<div class="row"><dt>' + esc(k) + '</dt><dd>' + (v === '' || v == null ? '&mdash;' : v) + '</dd></div>'; }
  function openDrawer(id) {
    var a = apps.filter(function (x) { return x.id === id; })[0]; if (!a) return;
    selectedId = id;
    $('d-title').textContent = a.student_first_name + ' ' + a.student_last_name;
    $('d-sub').textContent = a.reference + ' \u00b7 submitted ' + fmt(a.createdAt);
    var phone = esc(a.phone), mail = a.email ? '<a href="mailto:' + esc(a.email) + '">' + esc(a.email) + '</a>' : '';
    $('d-body').innerHTML =
      '<div class="sec"><h3>Student</h3><dl>' +
        row('Date of birth', esc(a.student_dob) + ' (age ' + esc(age(a.student_dob)) + ')') + row('Gender', esc(a.student_gender)) +
        row('Section', esc(a.section)) + row('Class or level', esc(a.class_applying)) + row('Previous school', esc(a.previous_school)) +
      '</dl></div>' +
      '<div class="sec"><h3>Parent or guardian</h3><dl>' +
        row('Name', esc(a.parent_name)) + row('Relationship', esc(a.relationship)) +
        row('Phone', '<a href="tel:' + phone.replace(/\s/g, '') + '">' + phone + '</a>') + row('Email', mail) + row('Home area', esc(a.address_area)) +
      '</dl></div>' +
      '<div class="sec"><h3>Visit and message</h3><dl>' + row('Tour requested', a.tour === 'Yes' ? 'Yes' : 'No') + row('Message', esc(a.message)) + '</dl></div>' +
      '<div class="sec"><h3>Office use</h3><div class="office">' +
        '<div><label for="d-status">Status</label><select id="d-status">' + statuses.map(function (s) { return '<option' + (s === a.status ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') + '</select></div>' +
        '<div><label for="d-notes">Notes (staff only)</label><textarea id="d-notes">' + esc(a.notes) + '</textarea></div>' +
        (a.updatedAt !== a.createdAt ? '<small>Last updated ' + esc(fmt(a.updatedAt)) + '</small>' : '') +
      '</div></div>' +
      '<div class="acts"><button class="btn" id="d-save" type="button">Save changes</button><button class="btn line" style="border-color:var(--navy);color:var(--navy)" id="d-print" type="button">Print</button><button class="btn red" id="d-del" type="button">Delete</button><span class="saved" id="d-saved" role="status"></span></div>';
    $('shade').hidden = false; $('drawer').hidden = false;
    $('d-close').focus();
    $('d-save').onclick = function () { save(a.id); };
    $('d-print').onclick = function () { window.print(); };
    $('d-del').onclick = function () { remove(a); };
    render();
  }
  function closeDrawer() { $('drawer').hidden = true; $('shade').hidden = true; selectedId = null; if (apps.length) render(); }
  $('d-close').addEventListener('click', closeDrawer);
  $('shade').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('drawer').hidden) closeDrawer(); });

  function save(id) {
    var b = $('d-save'); b.disabled = true;
    api('/api/admin/applications/' + encodeURIComponent(id), { method: 'PATCH', body: JSON.stringify({ status: $('d-status').value, notes: $('d-notes').value }) })
      .then(function (j) {
        apps = apps.map(function (x) { return x.id === id ? j.application : x; });
        render(); $('d-saved').textContent = 'Saved';
        var n = apps.filter(function (a) { return a.status === 'New'; }).length;
        document.title = (n ? '(' + n + ') ' : '') + 'Admissions Office | Royal International Schools';
      })
      .catch(function (e) { if (e.message !== 'auth') $('d-saved').textContent = e.message; })
      .then(function () { b.disabled = false; });
  }
  function remove(a) {
    if (!confirm('Delete the application for ' + a.student_first_name + ' ' + a.student_last_name + ' (' + a.reference + ')?\nThis cannot be undone.')) return;
    api('/api/admin/applications/' + encodeURIComponent(a.id), { method: 'DELETE' })
      .then(function () { apps = apps.filter(function (x) { return x.id !== a.id; }); closeDrawer(); render(); })
      .catch(function (e) { if (e.message !== 'auth') alert(e.message); });
  }

  /* start */
  api('/api/admin/me').then(showDash).catch(function () { showLogin(); });
})();
</script>
</body>
</html>
